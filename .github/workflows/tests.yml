name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # core/ imports nothing outside the standard library at module level,
      # so pytest alone runs most of the suite - no camera, no microphone,
      # no torch.  The perception tests (CAP-7) additionally need the two
      # libraries the bot itself needs; they skip when those are missing,
      # so this step installs them to make sure CI exercises them too.
      # opencv-python-headless is the same cv2 with the GUI bindings removed,
      # because a runner has no libGL.
      - name: Install test dependencies
        run: python -m pip install pytest numpy opencv-python-headless

      # OPEN-10: bring the detector in so CI exercises a real model load and
      # not just the offline decoding.  Best effort - if the download fails the
      # test skips rather than fails, so a red build has to mean a real bug and
      # never "raw.githubusercontent was flaky".
      - name: Cache the vision model
        id: vision-model
        uses: actions/cache@v4
        with:
          path: models/vision
          key: vision-model-nanodet-2022nov

      - name: Fetch the vision model
        if: steps.vision-model.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python fetch_vision_model.py

      - name: Run tests
        run: python -m pytest -v
