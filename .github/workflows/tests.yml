name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # core/ imports nothing outside the standard library at module level,
      # so the suite needs pytest and nothing else - no camera, no microphone,
      # no torch. That is what makes it runnable on a bare CI runner.
      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v
